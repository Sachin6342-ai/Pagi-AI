name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi
          VERSION_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Detected Java version line: $VERSION_OUTPUT"
          MAJOR_VERSION=$(echo "$VERSION_OUTPUT" | sed -E 's/.*"([0-9]+)(\.[0-9]+)*".*/\1/')
          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not detect active Java major version."
            exit 1
          fi
          echo "Active Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Active Java major version ($MAJOR_VERSION) is lower than required Java 17."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          KEYSTORE_FILE="./debug.keystore"
          if [ -f "$KEYSTORE_FILE" ]; then
            echo "Existing ./debug.keystore found."
          else
            echo "Generating temporary ./debug.keystore using Java 17 keytool..."
            "${JAVA_HOME}/bin/keytool" -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "$KEYSTORE_FILE" ] || [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Failed to create or verify ./debug.keystore."
            exit 1
          fi
          echo "Verified ./debug.keystore is present."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Searching inside app/build/outputs/apk for discovered APK files:"
              find app/build/outputs/apk -type f -name "*.apk" -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is not a regular file."
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is empty."
            exit 1
          fi
          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "::error::Selected file does not have the .apk extension."
              exit 1
              ;;
          esac
          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::Selected APK path does not match app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi
          echo "Verified regular non-empty APK at $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Verified APK is missing or empty prior to release preparation."
            exit 1
          fi
          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          if [ -z "$SANITIZED_REPO" ]; then
            SANITIZED_REPO="android-app"
          fi
          ASSET_FILENAME="${SANITIZED_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_TMP_DIR=$(mktemp -d "${RUNNER_TEMP}/apk-release-XXXXXX")
          ASSET_PATH="${RELEASE_TMP_DIR}/${ASSET_FILENAME}"
          cp "$SOURCE_APK" "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Failed to copy release asset to $ASSET_PATH"
            exit 1
          fi
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_filename=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $ASSET_FILENAME"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_FILENAME: ${{ steps.prepare_asset.outputs.asset_filename }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is not installed."
            exit 1
          fi
          gh --version
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::warning::Prepared release asset is missing or empty at $ASSET_PATH"
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::warning::Prepared release asset does not have a .apk extension."
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES=$(cat <<EOF
          ### Automatically Generated Debug APK
          - **Build Status**: Built automatically by GitHub Actions
          - **Workflow Run Number**: ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt**: ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA**: ${GITHUB_SHA}
          - **Intended Use**: Intended for testing only (not a Google Play Store production release)
          - **Signing**: Signed only with a temporary debug keystore
          EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$GITHUB_SHA" \
            --latest

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          ASSET_FILENAME: ${{ steps.prepare_asset.outputs.asset_filename }}
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "$PUBLISH_OUTCOME" = "success" ] && RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq '.url' 2>/dev/null) && [ -n "$RELEASE_URL" ]; then
            echo "GitHub Release published successfully!"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_FILENAME"
            echo "The APK can be downloaded directly from the release Assets section, and the normal Actions artifact (app-debug-apk) is also available as a backup."

            {
              echo "## Debug APK Build & Release Summary"
              echo "- **Release Status**: Published"
              echo "- **Release Title**: \`$RELEASE_TITLE\`"
              echo "- **Release Tag**: \`$RELEASE_TAG\`"
              echo "- **Direct GitHub Release Page**: $RELEASE_URL"
              echo "- **APK Asset Filename**: \`$ASSET_FILENAME\`"
              echo ""
              echo "You can download the APK directly on your phone from the **Assets** section of the GitHub Release link above. The normal GitHub Actions artifact (\`app-debug-apk\`) is also available on this workflow run summary page as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed, but the debug APK build and Actions artifact upload succeeded."
            echo "APK Build Status: Succeeded"
            echo "Backup Artifact: The GitHub Actions artifact named 'app-debug-apk' remains available for download on this workflow run page."

            {
              echo "## Debug APK Build Summary (Release Warning)"
              echo "> **Warning:** GitHub Release publishing failed or was skipped, but **the debug APK build and Actions artifact upload succeeded**."
              echo ""
              echo "- **APK Build Status**: Succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)"
              echo "- **Backup Download**: Download the **\`app-debug-apk\`** artifact directly from the **Artifacts** section of this GitHub Actions workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
